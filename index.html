<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUITS™ Scene Packs — Free 4K &amp; 1080p Editor Archive</title>
  <meta name="description" content="Browse free logoless 4K and 1080p scene packs from SUITS, Series, and Movies curated for video editors." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-canvas: #08080a;
      --bg-surface: #111115;
      --bg-elevated: #17171d;
      --border-hairline: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #f4f4f6;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --accent: #e5a93c;
      --accent-hover: #f0b952;
      --danger: #f43f5e;
      --success: #34d399;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    h1, h2, h3, .font-display {
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      margin: 0;
    }

    .mono {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    .hidden {
      display: none !important;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(8, 8, 10, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-hairline);
    }

    .header-inner {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }

    .brand {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-primary);
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }

    .brand:hover {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .nav-link {
      position: relative;
      background: none;
      border: none;
      padding: 6px 0;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--text-primary);
    }

    .nav-link.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -19px;
      height: 2px;
      background: var(--accent);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--radius-md);
      border: none;
      background: var(--accent);
      color: #08080a;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    .btn-secondary:hover {
      border-color: rgba(255, 255, 255, 0.32);
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-hairline);
      background: var(--bg-surface);
      color: var(--text-secondary);
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .icon-btn:hover {
      color: var(--accent);
      border-color: var(--border-strong);
    }

    .mobile-menu-btn {
      display: none;
    }

    .mobile-drawer {
      display: none;
      border-top: 1px solid var(--border-hairline);
      background: #0e0e12;
      padding: 12px 20px 16px;
    }

    .mobile-drawer.open {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .mobile-drawer button {
      text-align: left;
      padding: 12px;
      border-radius: var(--radius-md);
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .mobile-drawer button.active {
      background: rgba(255, 255, 255, 0.06);
      color: var(--accent);
    }

    /* Hero */
    .main-wrap {
      padding: 40px 0 64px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: stretch;
    }

    .kicker {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 12px;
    }

    .hero-title {
      font-size: clamp(2.1rem, 3.8vw, 3.1rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }

    .hero-copy {
      margin: 16px 0 0;
      font-size: 15px;
      line-height: 1.65;
      color: var(--text-secondary);
      max-width: 540px;
    }

    .search-box {
      position: relative;
      margin-top: 26px;
      max-width: 540px;
    }

    .search-input {
      width: 100%;
      height: 48px;
      padding: 0 42px 0 42px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .clear-search-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 6px;
    }

    .hero-actions {
      margin-top: 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .spotlight-card {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border-hairline);
      background: var(--bg-surface);
      min-height: 300px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .spotlight-card img, .spotlight-card svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .spotlight-card:hover img, .spotlight-card:hover svg {
      transform: scale(1.03);
    }

    .spotlight-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(8, 8, 10, 0.94) 10%, rgba(8, 8, 10, 0.4) 55%, transparent);
    }

    .spotlight-body {
      position: relative;
      z-index: 2;
      padding: 24px;
    }

    /* Metric strip */
    .metrics-strip {
      margin-top: 32px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      background: var(--bg-surface);
    }

    .metric-cell {
      padding: 18px 24px;
      border-right: 1px solid var(--border-hairline);
    }

    .metric-cell:last-child {
      border-right: none;
    }

    .metric-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin: 0;
    }

    .metric-value {
      font-size: 22px;
      font-weight: 600;
      margin: 6px 0 0;
    }

    /* Sections & Grids */
    .section-block {
      margin-top: 56px;
    }

    .section-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .section-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    .section-subtitle {
      margin: 6px 0 0;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    /* Pack Card */
    .pack-card {
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .pack-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-strong);
    }

    .pack-thumb {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #0d0d11;
      overflow: hidden;
    }

    .pack-thumb img, .pack-thumb svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .pack-card:hover .pack-thumb img,
    .pack-card:hover .pack-thumb svg {
      transform: scale(1.03);
    }

    .pack-body {
      padding: 18px 20px 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .pack-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .pack-title {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-primary);
    }

    .pack-card:hover .pack-title {
      color: var(--accent);
    }

    .pack-source {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .pack-footer {
      margin-top: auto;
      padding-top: 14px;
      margin-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Category Card */
    .cat-card {
      text-align: left;
      padding: 26px;
      border-radius: var(--radius-lg);
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
      color: var(--text-primary);
    }

    .cat-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-strong);
    }

    /* Browse Toolbar */
    .toolbar {
      margin-top: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .segmented {
      display: inline-flex;
      padding: 4px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      gap: 4px;
    }

    .seg-btn {
      padding: 7px 12px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    .seg-btn.active {
      background: var(--accent);
      color: #08080a;
      font-weight: 600;
    }

    .select-dark {
      height: 38px;
      padding: 0 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-hairline);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    /* Detail View */
    .detail-grid {
      display: grid;
      grid-template-columns: 7fr 5fr;
      gap: 32px;
      align-items: start;
    }

    .detail-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 26px;
      position: sticky;
      top: 88px;
    }

    .specs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 20px 0;
      border-top: 1px solid var(--border-hairline);
      border-bottom: 1px solid var(--border-hairline);
      margin: 20px 0;
    }

    .clip-list {
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      background: var(--bg-surface);
      overflow: hidden;
      margin-top: 24px;
    }

    .clip-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 14px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }

    .modal-box {
      width: 100%;
      max-width: 520px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 28px;
    }

    .modal-box.wide {
      max-width: 720px;
    }

    .field-label {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .field-input, .field-textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
    }

    .field-input:focus, .field-textarea:focus {
      border-color: var(--accent);
    }

    .alert-error {
      padding: 10px 14px;
      border-radius: var(--radius-md);
      background: rgba(244, 63, 94, 0.14);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #fecdd3;
      font-size: 13px;
    }

    .alert-ok {
      padding: 10px 14px;
      border-radius: var(--radius-md);
      background: rgba(52, 211, 153, 0.14);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: #a7f3d0;
      font-size: 13px;
    }

    .site-footer {
      border-top: 1px solid var(--border-hairline);
      padding: 36px 0;
      margin-top: 64px;
      color: var(--text-muted);
      font-size: 13px;
    }

    @media (max-width: 1024px) {
      .hero-grid, .detail-grid {
        grid-template-columns: 1fr;
      }
      .grid-4 {
        grid-template-columns: repeat(2, 1fr);
      }
      .grid-3 {
        grid-template-columns: repeat(2, 1fr);
      }
      .metrics-strip {
        grid-template-columns: repeat(2, 1fr);
      }
      .metric-cell:nth-child(2) {
        border-right: none;
      }
      .metric-cell:nth-child(1), .metric-cell:nth-child(2) {
        border-bottom: 1px solid var(--border-hairline);
      }
      .detail-panel {
        position: static;
      }
    }

    @media (max-width: 768px) {
      .nav-links, .desktop-cta {
        display: none;
      }
      .mobile-menu-btn {
        display: inline-flex;
      }
      .grid-4, .grid-3, .grid-2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <button type="button" class="brand" data-nav="home">SUITS™ SCENE PACKS</button>

      <nav class="nav-links" aria-label="Primary navigation">
        <button type="button" class="nav-link active" data-nav="home">Home</button>
        <button type="button" class="nav-link" data-nav="suits">Packs</button>
        <button type="button" class="nav-link" data-nav="series">Series</button>
        <button type="button" class="nav-link" data-nav="movies">Movies</button>
      </nav>

      <div class="header-actions">
        <button type="button" class="btn-primary desktop-cta" data-nav="suits">SUITS Archive</button>
        <button type="button" id="mobileMenuToggle" class="icon-btn mobile-menu-btn" aria-label="Toggle navigation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <button type="button" id="adminGearBtn" class="icon-btn" aria-label="Admin settings" title="Admin">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3" />

          </svg>
        </button>
      </div>
    </div>

    <div id="mobileDrawer" class="mobile-drawer" aria-label="Mobile navigation">
      <button type="button" data-nav="home">Home</button>
      <button type="button" data-nav="suits">Packs</button>
      <button type="button" data-nav="series">Series</button>
      <button type="button" data-nav="movies">Movies</button>
    </div>
  </header>

  <main id="appRoot" class="container main-wrap"></main>

  <footer class="site-footer">
    <div class="container" style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center;">
      <div>
        <strong style="color:var(--text-primary);letter-spacing:0.06em;">SUITS™ SCENE PACKS</strong>
        <p style="margin:6px 0 0;">Free 4K and 1080p logoless scene-pack index for video editors.</p>
      </div>
      <div style="display:flex;gap:20px;">
        <button type="button" class="nav-link" data-nav="home">Home</button>
        <button type="button" class="nav-link" data-nav="suits">Packs</button>
        <button type="button" class="nav-link" data-nav="series">Series</button>
        <button type="button" class="nav-link" data-nav="movies">Movies</button>
      </div>
    </div>
  </footer>

  <!-- Admin Passkey Modal -->
  <div id="adminPasskeyModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-label="Admin Passkey Login">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
        <div>
          <h2 style="font-size:20px;font-weight:700;">Admin Passkey</h2>
          <p style="margin:4px 0 0;font-size:12px;color:var(--text-secondary);">Verified securely on the backend</p>
        </div>
        <button type="button" id="closePasskeyModal" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <form id="passkeyForm" style="display:flex;flex-direction:column;gap:14px;">
        <div>
          <label for="passkeyInput" class="field-label">Enter Admin Passkey</label>
          <input id="passkeyInput" type="password" required autocomplete="current-password" class="field-input" placeholder="Server-verified passkey" />
        </div>
        <div id="passkeyError" class="alert-error hidden"></div>
        <button type="submit" id="passkeySubmitBtn" class="btn-primary" style="width:100%;height:44px;">Unlock Admin Dashboard</button>
      </form>
    </div>
  </div>

  <!-- Admin Pack Editor Modal -->
  <div id="adminPackModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-label="Manage Scene Pack">
    <div class="modal-box wide">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
        <h2 id="packModalTitle" style="font-size:20px;font-weight:700;">Add Scene Pack</h2>
        <button type="button" id="closePackModal" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <form id="packEditorForm" style="display:flex;flex-direction:column;gap:14px;">
        <input type="hidden" id="packIdField" />
        <div class="grid-2" style="gap:14px;">
          <div>
            <label class="field-label" for="packTitleField">Title *</label>
            <input id="packTitleField" type="text" required class="field-input" placeholder="Harvey Specter — Executive Cut" />
          </div>
          <div>
            <label class="field-label" for="packSourceField">Show / Movie *</label>
            <input id="packSourceField" type="text" required class="field-input" placeholder="SUITS (Seasons 1–9)" />
          </div>
        </div>
        <div class="grid-3" style="gap:14px;">
          <div>
            <label class="field-label" for="packCategoryField">Category</label>
            <select id="packCategoryField" class="field-input"></select>
          </div>
          <div>
            <label class="field-label" for="packResField">Resolution</label>
            <select id="packResField" class="field-input">
              <option value="4K UHD">4K UHD</option>
              <option value="1080p HD">1080p HD</option>
            </select>
          </div>
          <div>
            <label class="field-label" for="packClipsField">Clip Count</label>
            <input id="packClipsField" type="number" min="1" value="120" class="field-input" />
          </div>
        </div>
        <div class="grid-2" style="gap:14px;">
          <div>
            <label class="field-label" for="packThumbFile">Upload Thumbnail Image</label>
            <input id="packThumbFile" type="file" accept="image/png,image/jpeg,image/webp" class="field-input" />
          </div>
          <div>
            <label class="field-label" for="packThumbUrl">Thumbnail URL</label>
            <input id="packThumbUrl" type="text" class="field-input" placeholder="/uploads/..." />
          </div>
        </div>
        <div>
          <label class="field-label" for="packDescField">Description</label>
          <textarea id="packDescField" rows="3" class="field-textarea" placeholder="Logoless scene pack description..."></textarea>
        </div>
        <div style="display:flex;gap:20px;flex-wrap:wrap;">
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
            <input id="packSuitsField" type="checkbox" checked /> Include in SUITS Collection
          </label>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
            <input id="packFeaturedField" type="checkbox" /> Featured on Homepage
          </label>
        </div>
        <div id="packModalFeedback" class="hidden"></div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:6px;">
          <button type="button" id="cancelPackBtn" class="btn-secondary">Cancel</button>
          <button type="submit" id="savePackBtn" class="btn-primary">Save Scene Pack</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    (function () {
      function makePosterDataUri(title, c1, c2) {
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="${c1}" />
              <stop offset="100%" stop-color="${c2}" />
            </linearGradient>
          </defs>
          <rect width="1280" height="720" fill="url(#g)" />
          <circle cx="960" cy="180" r="240" fill="#e5a93c" fill-opacity="0.12" />
          <rect x="72" y="540" width="1136" height="2" fill="rgba(255,255,255,0.16)" />
          <text x="72" y="610" fill="#f4f4f6" font-family="Outfit, sans-serif" font-size="38" font-weight="700">${title.replace(/&/g, '&amp;')}</text>
        </svg>`;
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      }

      const FALLBACK_CATEGORIES = [
        { id: 'cat-series', name: 'Series', slug: 'series', description: 'Logoless multi-season television and drama character packs.' },
        { id: 'cat-movies', name: 'Movies', slug: 'movies', description: 'Anamorphic feature film cuts and theatrical wide shots.' }
      ];

      const FALLBACK_PACKS = [
        {
          id: 'pack-harvey',
          slug: 'harvey-specter-executive-cut',
          title: 'Harvey Specter — Executive Cut',
          sourceTitle: 'SUITS (Seasons 1–9)',
          categoryId: 'cat-series',
          categoryName: 'Series',
          categorySlug: 'series',
          isSuitsCollection: true,
          featured: true,
          clipCount: 214,
          resolution: '4K UHD',
          frameRate: '23.976 fps',
          codec: 'H.264 MP4',
          aspectRatio: '16:9',
          fileSize: '3.8 GB',
          thumbnailUrl: makePosterDataUri('HARVEY SPECTER · EXECUTIVE CUT', '#191a22', '#0a0a0d'),
          description: 'Logoless 4K UHD office monologues, skyline silhouettes, and courtroom closings.',
          tags: ['SUITS', 'Harvey Specter', '4K'],
          clipSamples: [
            { code: 'SC-001', label: 'Corner Office Skyline Silhouette', duration: '00:18' },
            { code: 'SC-014', label: 'Deposition Room Entrance', duration: '00:12' }
          ],
          createdAt: '2026-11-18T09:00:00Z'
        },
        {
          id: 'pack-psl',
          slug: 'pearson-specter-litt-boardroom',
          title: 'Pearson Specter Litt — Boardroom',
          sourceTitle: 'SUITS (Ensemble Pack)',
          categoryId: 'cat-series',
          categoryName: 'Series',
          categorySlug: 'series',
          isSuitsCollection: true,
          featured: true,
          clipCount: 148,
          resolution: '4K UHD',
          frameRate: '23.976 fps',
          codec: 'H.264 MP4',
          aspectRatio: '16:9',
          fileSize: '2.6 GB',
          thumbnailUrl: makePosterDataUri('PEARSON SPECTER LITT · BOARDROOM', '#231e19', '#0a0a0d'),
          description: 'Dusk boardroom partner votes, glass hallway tracking shots, and crisp reaction cuts.',
          tags: ['SUITS', 'Boardroom', '4K'],
          clipSamples: [{ code: 'BR-004', label: 'Dusk Partner Vote Wide', duration: '00:22' }],
          createdAt: '2026-11-17T12:00:00Z'
        },
        {
          id: 'pack-arrakis',
          slug: 'arrakis-horizon-monolith',
          title: 'Arrakis Horizon — Monolith Cut',
          sourceTitle: 'Dune Cinema Archive',
          categoryId: 'cat-movies',
          categoryName: 'Movies',
          categorySlug: 'movies',
          isSuitsCollection: false,
          featured: true,
          clipCount: 184,
          resolution: '4K UHD',
          frameRate: '24.000 fps',
          codec: 'ProRes / H.264',
          aspectRatio: '2.39:1',
          fileSize: '4.2 GB',
          thumbnailUrl: makePosterDataUri('ARRAKIS HORIZON · MONOLITH', '#2b1f14', '#09090c'),
          description: 'Golden-hour desert canyons and wide theatrical establishing frames.',
          tags: ['Sci-Fi', 'IMAX', '4K'],
          clipSamples: [{ code: 'AR-012', label: 'Sandstone Ridge Sunrise', duration: '00:26' }],
          createdAt: '2026-11-16T10:00:00Z'
        },
        {
          id: 'pack-noir',
          slug: 'suits-noir-midnight-district',
          title: 'SUITS Noir — Midnight District',
          sourceTitle: 'SUITS Special Edition',
          categoryId: 'cat-movies',
          categoryName: 'Movies',
          categorySlug: 'movies',
          isSuitsCollection: true,
          featured: false,
          clipCount: 96,
          resolution: '4K UHD',
          frameRate: '23.976 fps',
          codec: 'H.264 MP4',
          aspectRatio: '16:9',
          fileSize: '2.1 GB',
          thumbnailUrl: makePosterDataUri('SUITS NOIR · MIDNIGHT DISTRICT', '#121821', '#08080a'),
          description: 'Rain-slicked midnight streets, wet bokeh, and dark aesthetic transitions.',
          tags: ['SUITS', 'Noir', '4K'],
          clipSamples: [{ code: 'NR-008', label: 'Wet Asphalt Reflection', duration: '00:15' }],
          createdAt: '2026-11-15T18:00:00Z'
        }
      ];

      const state = {
        view: 'home', // home | suits | series | movies | detail | admin
        detailSlug: '',
        packs: FALLBACK_PACKS,
        categories: FALLBACK_CATEGORIES,
        homeQuery: '',
        browseQuery: '',
        browseCategory: 'all',
        browseResolution: 'all',
        browseSort: 'recent',
        adminToken: sessionStorage.getItem('deezraa_admin_token') || '',
        adminAuthenticated: false,
        statusNotice: ''
      };

      const appRoot = document.getElementById('appRoot');
      const mobileDrawer = document.getElementById('mobileDrawer');

      function esc(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function adminHeaders(extra) {
        const h = Object.assign({}, extra || {});
        if (state.adminToken) h['x-admin-token'] = state.adminToken;
        return h;
      }

      async function loadCatalog() {
        try {
          const res = await fetch('/api/catalog');
          if (!res.ok) return;
          const data = await res.json();
          if (Array.isArray(data.packs)) state.packs = data.packs;
          if (Array.isArray(data.categories)) state.categories = data.categories;
          render();
        } catch {
          // Uses embedded fallback catalog when static preview runs without backend
        }
      }

      async function checkAdminSession() {
        try {
          const res = await fetch('/api/admin/session', {
            credentials: 'include',
            headers: adminHeaders()
          });
          const ct = res.headers.get('content-type') || '';
          if (res.ok && ct.includes('application/json')) {
            const data = await res.json();
            state.adminAuthenticated = Boolean(data.authenticated);
            if (!state.adminAuthenticated) {
              state.adminToken = '';
              sessionStorage.removeItem('deezraa_admin_token');
            }
            return state.adminAuthenticated;
          }
        } catch {
          state.adminAuthenticated = false;
        }
        return false;
      }

      function setView(view, detailSlug) {
        state.view = view;
        state.detailSlug = detailSlug || '';
        if (view === 'series') state.browseCategory = 'series';
        else if (view === 'movies') state.browseCategory = 'movies';
        else if (view === 'suits') state.browseCategory = 'all';

        mobileDrawer.classList.remove('open');
        document.querySelectorAll('[data-nav]').forEach((el) => {
          const target = el.getAttribute('data-nav');
          el.classList.toggle('active', target === view);
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      }

      function renderPackCard(pack) {
        return `
          <article class="pack-card" data-open-pack="${esc(pack.slug)}" tabindex="0" role="button">
            <div class="pack-thumb">
              <img src="${esc(pack.thumbnailUrl)}" alt="${esc(pack.title)}" referrerpolicy="no-referrer" />
            </div>
            <div class="pack-body">
              <div class="pack-meta">
                <span>${esc(pack.categoryName)}</span>
                <span>·</span>
                <span class="mono">${Number(pack.clipCount)} Clips</span>
                <span>·</span>
                <span class="mono" style="color:var(--accent);">${esc(pack.resolution)}</span>
              </div>
              <h3 class="pack-title">${esc(pack.title)}</h3>
              <p class="pack-source">${esc(pack.sourceTitle)}</p>
              <div class="pack-footer">
                <span class="mono">${esc(pack.fileSize)} · ${esc(pack.frameRate)}</span>
                <span style="color:var(--text-primary);font-weight:500;">View Details →</span>
              </div>
            </div>
          </article>
        `;
      }

      function renderHome() {
        const q = state.homeQuery.trim().toLowerCase();
        const spotlight = state.packs.find((p) => p.isSuitsCollection && p.featured) || state.packs[0];
        const totalClips = state.packs.reduce((s, p) => s + Number(p.clipCount || 0), 0);
        const suitsCount = state.packs.filter((p) => p.isSuitsCollection).length;
        const featured = state.packs.filter((p) => p.featured).slice(0, 3);
        const recent = [...state.packs].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 4);

        const matches = q
          ? state.packs.filter((p) =>
              p.title.toLowerCase().includes(q) ||
              p.sourceTitle.toLowerCase().includes(q) ||
              p.categoryName.toLowerCase().includes(q) ||
              (p.description || '').toLowerCase().includes(q)
            )
          : [];

        return `
          <section class="hero-grid">
            <div style="display:flex;flex-direction:column;justify-content:center;">
              <p class="kicker">SUITS™ &amp; Cinema Archive</p>
              <h1 class="hero-title">Logoless 4K scene packs curated for editors.</h1>
              <p class="hero-copy">
                Explore clean, watermark-free scene pack catalogs from SUITS, series, and feature films with frame specs and scene indexes. 100% free with zero accounts.
              </p>
              <div class="search-box">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" />
                </svg>
                <input id="homeSearchInput" class="search-input" type="search" value="${esc(state.homeQuery)}" placeholder="Search SUITS, Harvey, movies, series, or 4K..." aria-label="Search scene packs" />
                ${state.homeQuery ? '<button type="button" id="homeClearSearch" class="clear-search-btn" aria-label="Clear search">✕</button>' : ''}
              </div>
              <div class="hero-actions">
                <button type="button" class="btn-primary" data-nav="suits">Browse SUITS Packs →</button>
                <button type="button" class="btn-secondary" data-nav="movies">Explore Movies</button>
              </div>
            </div>

            ${spotlight ? `
              <div class="spotlight-card" data-open-pack="${esc(spotlight.slug)}" tabindex="0" role="button">
                <img src="${esc(spotlight.thumbnailUrl)}" alt="${esc(spotlight.title)}" referrerpolicy="no-referrer" />
                <div class="spotlight-scrim"></div>
                <div class="spotlight-body">
                  <p class="mono" style="margin:0 0 6px;font-size:12px;color:var(--accent);">Featured Spotlight · ${esc(spotlight.resolution)} · ${spotlight.clipCount} Clips</p>
                  <h2 style="font-size:24px;font-weight:700;">${esc(spotlight.title)}</h2>
                  <p style="margin:4px 0 0;font-size:13px;color:var(--text-secondary);">${esc(spotlight.sourceTitle)}</p>
                </div>
              </div>
            ` : ''}
          </section>

          <section class="metrics-strip">
            <div class="metric-cell"><p class="metric-label">Free Scene Packs</p><p class="metric-value mono">${state.packs.length}</p></div>
            <div class="metric-cell"><p class="metric-label">SUITS Archive Packs</p><p class="metric-value mono" style="color:var(--accent);">${suitsCount}</p></div>
            <div class="metric-cell"><p class="metric-label">Logoless Clips Indexed</p><p class="metric-value mono">${totalClips.toLocaleString()}</p></div>
            <div class="metric-cell"><p class="metric-label">Access Policy</p><p class="metric-value" style="font-size:18px;">100% Free · No Login</p></div>
          </section>

          ${q ? `
            <section class="section-block">
              <div class="section-header">
                <div>
                  <h2 class="section-title">Search Results</h2>
                  <p class="section-subtitle mono">${matches.length} pack(s) matched "${esc(state.homeQuery)}"</p>
                </div>
              </div>
              ${matches.length ? `<div class="grid-3">${matches.map(renderPackCard).join('')}</div>` : `<div style="padding:48px;text-align:center;border:1px solid var(--border-hairline);border-radius:var(--radius-lg);background:var(--bg-surface);">No scene packs matched your search.</div>`}
            </section>
          ` : `
            <section class="section-block">
              <div class="section-header">
                <div>
                  <h2 class="section-title">Featured Scene Packs</h2>
                  <p class="section-subtitle">Hand-curated logoless masters ready for timeline editing.</p>
                </div>
                <button type="button" class="nav-link" data-nav="suits" style="color:var(--accent);">All SUITS Packs →</button>
              </div>
              <div class="grid-3">${featured.map(renderPackCard).join('')}</div>
            </section>

            <section class="section-block">
              <div class="section-header">
                <div>
                  <h2 class="section-title">Browse Categories</h2>
                  <p class="section-subtitle">Explore complete Series and Movies archives with zero account barriers.</p>
                </div>
              </div>
              <div class="grid-2">
                ${state.categories.map((cat) => {
                  const catPacks = state.packs.filter((p) => p.categoryId === cat.id || p.categorySlug === cat.slug);
                  const catClips = catPacks.reduce((s, p) => s + Number(p.clipCount || 0), 0);
                  return `
                    <button type="button" class="cat-card" data-nav="${esc(cat.slug)}">
                      <div style="display:flex;justify-content:space-between;align-items:center;">
                        <strong style="font-size:20px;font-family:'Outfit',sans-serif;">${esc(cat.name)}</strong>
                        <span style="font-size:12px;color:var(--accent);">Browse ${esc(cat.name)} →</span>
                      </div>
                      <p style="margin:10px 0 0;font-size:14px;color:var(--text-secondary);line-height:1.5;">${esc(cat.description)}</p>
                      <p class="mono" style="margin:16px 0 0;font-size:12px;color:var(--text-muted);">${catPacks.length} Packs · ${catClips.toLocaleString()} Clips · Free Access</p>
                    </button>
                  `;
                }).join('')}
              </div>
            </section>

            <section class="section-block">
              <div class="section-header">
                <div>
                  <h2 class="section-title">Recently Added</h2>
                  <p class="section-subtitle">Latest high-bitrate masters added to the archive.</p>
                </div>
              </div>
              <div class="grid-4">${recent.map(renderPackCard).join('')}</div>
            </section>
          `}
        `;
      }

      function renderBrowse() {
        const isSuitsView = state.view === 'suits';
        const q = state.browseQuery.trim().toLowerCase();

        let list = state.packs.filter((p) => {
          if (isSuitsView && !p.isSuitsCollection) return false;
          if (state.browseCategory !== 'all' && p.categorySlug !== state.browseCategory) return false;
          if (state.browseResolution !== 'all' && p.resolution !== state.browseResolution) return false;
          if (q) {
            return (
              p.title.toLowerCase().includes(q) ||
              p.sourceTitle.toLowerCase().includes(q) ||
              (p.description || '').toLowerCase().includes(q)
            );
          }
          return true;
        });

        if (state.browseSort === 'clips') {
          list.sort((a, b) => b.clipCount - a.clipCount);
        } else if (state.browseSort === 'featured') {
          list.sort((a, b) => (a.featured === b.featured ? 0 : a.featured ? -1 : 1));
        } else {
          list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        }

        const title = isSuitsView
          ? 'SUITS™ Scene Packs'
          : state.view === 'series'
            ? 'Series Scene Packs'
            : 'Movies Scene Packs';

        return `
          <section style="padding-bottom:24px;border-bottom:1px solid var(--border-hairline);">
            <p class="kicker">${isSuitsView ? 'SUITS Collection' : 'Category Archive'}</p>
            <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;">
              <div>
                <h1 style="font-size:34px;font-weight:700;">${title}</h1>
                <p style="margin:8px 0 0;font-size:14px;color:var(--text-secondary);">Free, logoless scene packs indexed for editors.</p>
              </div>
              <div class="mono" style="font-size:13px;color:var(--text-secondary);">
                <strong style="color:var(--text-primary);">${list.length}</strong> Pack(s) ·
                <strong style="color:var(--accent);">${list.reduce((s, p) => s + Number(p.clipCount || 0), 0).toLocaleString()}</strong> Clips
              </div>
            </div>
          </section>

          <section class="toolbar">
            <div style="position:relative;flex:1;min-width:240px;max-width:380px;">
              <input id="browseSearchInput" class="search-input" style="height:40px;padding-left:14px;" type="search" value="${esc(state.browseQuery)}" placeholder="Filter by title or character..." />
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;">
              ${isSuitsView ? `
                <div class="segmented">
                  <button type="button" class="seg-btn ${state.browseCategory === 'all' ? 'active' : ''}" data-cat="all">All</button>
                  ${state.categories.map((c) => `<button type="button" class="seg-btn ${state.browseCategory === c.slug ? 'active' : ''}" data-cat="${esc(c.slug)}">${esc(c.name)}</button>`).join('')}
                </div>
              ` : ''}
              <div class="segmented">
                ${['all', '4K UHD', '1080p HD'].map((r) => `<button type="button" class="seg-btn ${state.browseResolution === r ? 'active' : ''}" data-res="${r}">${r === 'all' ? 'Any Res' : r}</button>`).join('')}
              </div>
              <select id="browseSortSelect" class="select-dark" aria-label="Sort packs">
                <option value="recent" ${state.browseSort === 'recent' ? 'selected' : ''}>Recently Added</option>
                <option value="featured" ${state.browseSort === 'featured' ? 'selected' : ''}>Featured First</option>
                <option value="clips" ${state.browseSort === 'clips' ? 'selected' : ''}>Most Clips</option>
              </select>
            </div>
          </section>

          <section style="margin-top:28px;">
            ${list.length ? `<div class="grid-3">${list.map(renderPackCard).join('')}</div>` : `<div style="padding:48px;text-align:center;border:1px solid var(--border-hairline);border-radius:var(--radius-lg);background:var(--bg-surface);">No scene packs matched your filters.</div>`}
          </section>
        `;
      }

      function renderDetail() {
        const pack = state.packs.find((p) => p.slug === state.detailSlug || p.id === state.detailSlug);
        if (!pack) {
          return `<div style="padding:64px 0;text-align:center;"><h2>Scene pack not found</h2><button type="button" class="btn-primary" style="margin-top:16px;" data-nav="home">Return Home</button></div>`;
        }
        return `
          <div style="margin-bottom:20px;font-size:12px;color:var(--text-secondary);display:flex;gap:8px;align-items:center;">
            <button type="button" class="btn-secondary" style="padding:6px 12px;font-size:12px;" data-nav="${pack.isSuitsCollection ? 'suits' : esc(pack.categorySlug)}">← Back</button>
            <span>/</span>
            <span>${esc(pack.categoryName)}</span>
            <span>/</span>
            <span style="color:var(--text-primary);">${esc(pack.title)}</span>
          </div>
          <div class="detail-grid">
            <div>
              <div class="pack-thumb" style="border-radius:var(--radius-lg);border:1px solid var(--border-hairline);">
                <img src="${esc(pack.thumbnailUrl)}" alt="${esc(pack.title)}" referrerpolicy="no-referrer" />
              </div>
              <h2 style="margin-top:24px;font-size:18px;font-weight:600;">Pack Overview</h2>
              <p style="margin:10px 0 0;font-size:15px;line-height:1.65;color:#d4d4d8;">${esc(pack.description)}</p>
              <div class="clip-list">
                <div style="padding:14px 20px;display:flex;justify-content:space-between;align-items:center;font-weight:600;">
                  <span>Included Clip Index</span>
                  <span class="mono" style="font-size:12px;color:var(--text-secondary);">${pack.clipCount} Total Clips</span>
                </div>
                ${(pack.clipSamples || []).map((c) => `
                  <div class="clip-row">
                    <div><span class="mono" style="color:var(--accent);margin-right:12px;font-size:12px;">${esc(c.code)}</span>${esc(c.label)}</div>
                    <span class="mono" style="font-size:12px;color:var(--text-secondary);">${esc(c.duration)}</span>
                  </div>
                `).join('')}
              </div>
            </div>

            <aside class="detail-panel">
              <p style="margin:0 0 8px;font-size:12px;color:var(--text-secondary);">${esc(pack.categoryName)} ${pack.isSuitsCollection ? '· <span style="color:var(--accent);">SUITS Collection</span>' : ''} · <span class="mono">${esc(pack.resolution)}</span></p>
              <h1 style="font-size:26px;font-weight:700;">${esc(pack.title)}</h1>
              <p style="margin:6px 0 0;font-size:14px;color:var(--text-secondary);">${esc(pack.sourceTitle)}</p>
              <div class="specs-grid">
                <div><span style="font-size:11px;color:var(--text-muted);">Available Clips</span><div class="mono" style="font-weight:600;margin-top:4px;">${pack.clipCount} Clips</div></div>
                <div><span style="font-size:11px;color:var(--text-muted);">Package Size</span><div class="mono" style="font-weight:600;margin-top:4px;">${esc(pack.fileSize)}</div></div>
                <div><span style="font-size:11px;color:var(--text-muted);">Resolution</span><div class="mono" style="font-weight:600;color:var(--accent);margin-top:4px;">${esc(pack.resolution)}</div></div>
                <div><span style="font-size:11px;color:var(--text-muted);">Frame Rate</span><div class="mono" style="font-weight:600;margin-top:4px;">${esc(pack.frameRate)}</div></div>
              </div>
              <button type="button" id="copyPackUrlBtn" class="btn-primary" style="width:100%;height:42px;">Copy Pack Page Link</button>
            </aside>
          </div>
        `;
      }

      function renderAdmin() {
        if (!state.adminAuthenticated) {
          return `<div style="padding:64px 0;text-align:center;"><h2>Admin authentication required</h2><button type="button" id="reopenPasskeyBtn" class="btn-primary" style="margin-top:16px;">Enter Admin Passkey</button></div>`;
        }
        return `
          <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;margin-bottom:24px;">
            <div>
              <h1 style="font-size:28px;font-weight:700;">Admin Dashboard</h1>
              <p style="margin:4px 0 0;font-size:13px;color:var(--text-secondary);">Manage scene packs, thumbnails, and categories</p>
            </div>
            <div style="display:flex;gap:10px;">
              <button type="button" id="openNewPackBtn" class="btn-primary">+ Add Scene Pack</button>
              <button type="button" id="adminLockBtn" class="btn-secondary">Lock Session</button>
            </div>
          </div>
          ${state.statusNotice ? `<div class="alert-ok" style="margin-bottom:18px;">${esc(state.statusNotice)}</div>` : ''}
          <div style="border:1px solid var(--border-hairline);border-radius:var(--radius-lg);background:var(--bg-surface);overflow:hidden;">
            ${state.packs.map((p) => `
              <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-top:1px solid rgba(255,255,255,0.06);">
                <div style="display:flex;align-items:center;gap:14px;min-width:0;">
                  <img src="${esc(p.thumbnailUrl)}" alt="${esc(p.title)}" style="width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;border:1px solid var(--border-hairline);" />
                  <div>
                    <strong style="font-size:15px;">${esc(p.title)}</strong>
                    <div style="font-size:12px;color:var(--text-secondary);margin-top:3px;">${esc(p.categoryName)} · ${p.clipCount} Clips · ${esc(p.resolution)} ${p.isSuitsCollection ? '· SUITS' : ''}</div>
                  </div>
                </div>
                <div style="display:flex;gap:8px;">
                  <button type="button" class="btn-secondary" style="padding:7px 12px;font-size:12px;" data-edit-pack="${esc(p.id)}">Edit</button>
                  <button type="button" class="btn-secondary" style="padding:7px 12px;font-size:12px;color:#fda4af;" data-delete-pack="${esc(p.id)}">Delete</button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      function render() {
        if (state.view === 'home') appRoot.innerHTML = renderHome();
        else if (state.view === 'detail') appRoot.innerHTML = renderDetail();
        else if (state.view === 'admin') appRoot.innerHTML = renderAdmin();
        else appRoot.innerHTML = renderBrowse();
        bindViewEvents();
      }

      function bindViewEvents() {
        const homeSearch = document.getElementById('homeSearchInput');
        if (homeSearch) {
          homeSearch.addEventListener('input', (e) => {
            state.homeQuery = e.target.value;
            const pos = e.target.selectionStart;
            render();
            const next = document.getElementById('homeSearchInput');
            if (next) {
              next.focus();
              next.setSelectionRange(pos, pos);
            }
          });
        }
        const homeClear = document.getElementById('homeClearSearch');
        if (homeClear) {
          homeClear.addEventListener('click', () => {
            state.homeQuery = '';
            render();
          });
        }
        const browseSearch = document.getElementById('browseSearchInput');
        if (browseSearch) {
          browseSearch.addEventListener('input', (e) => {
            state.browseQuery = e.target.value;
            const pos = e.target.selectionStart;
            render();
            const next = document.getElementById('browseSearchInput');
            if (next) {
              next.focus();
              next.setSelectionRange(pos, pos);
            }
          });
        }
        document.querySelectorAll('[data-cat]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.browseCategory = btn.getAttribute('data-cat');
            render();
          });
        });
        document.querySelectorAll('[data-res]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.browseResolution = btn.getAttribute('data-res');
            render();
          });
        });
        const sortSel = document.getElementById('browseSortSelect');
        if (sortSel) {
          sortSel.addEventListener('change', (e) => {
            state.browseSort = e.target.value;
            render();
          });
        }
        document.querySelectorAll('[data-open-pack]').forEach((card) => {
          card.addEventListener('click', () => setView('detail', card.getAttribute('data-open-pack')));
        });
        document.querySelectorAll('#appRoot [data-nav]').forEach((btn) => {
          btn.addEventListener('click', () => setView(btn.getAttribute('data-nav')));
        });
        const copyBtn = document.getElementById('copyPackUrlBtn');
        if (copyBtn) {
          copyBtn.addEventListener('click', () => {
            navigator.clipboard?.writeText(window.location.href).catch(() => {});
            copyBtn.textContent = 'Pack Link Copied';
            setTimeout(() => { copyBtn.textContent = 'Copy Pack Page Link'; }, 2000);
          });
        }
        const reopenPasskey = document.getElementById('reopenPasskeyBtn');
        if (reopenPasskey) {
          reopenPasskey.addEventListener('click', openPasskeyModal);
        }
        const newPackBtn = document.getElementById('openNewPackBtn');
        if (newPackBtn) {
          newPackBtn.addEventListener('click', () => openPackEditor(null));
        }
        const lockBtn = document.getElementById('adminLockBtn');
        if (lockBtn) {
          lockBtn.addEventListener('click', async () => {
            state.adminToken = '';
            sessionStorage.removeItem('deezraa_admin_token');
            state.adminAuthenticated = false;
            await fetch('/api/admin/logout', { method: 'POST', credentials: 'include' }).catch(() => {});
            setView('home');
          });
        }
        document.querySelectorAll('[data-edit-pack]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const p = state.packs.find((x) => x.id === btn.getAttribute('data-edit-pack'));
            if (p) openPackEditor(p);
          });
        });
        document.querySelectorAll('[data-delete-pack]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const id = btn.getAttribute('data-delete-pack');
            const res = await fetch('/api/admin/packs/' + encodeURIComponent(id), {
              method: 'DELETE',
              credentials: 'include',
              headers: adminHeaders()
            });
            if (res.ok) {
              state.statusNotice = 'Scene pack deleted.';
              await loadCatalog();
            }
          });
        });
      }

      // Global Navigation & Modals
      document.querySelectorAll('.site-header [data-nav], .site-footer [data-nav]').forEach((btn) => {
        btn.addEventListener('click', () => setView(btn.getAttribute('data-nav')));
      });

      document.getElementById('mobileMenuToggle').addEventListener('click', () => {
        mobileDrawer.classList.toggle('open');
      });

      const passkeyModal = document.getElementById('adminPasskeyModal');
      const passkeyInput = document.getElementById('passkeyInput');
      const passkeyError = document.getElementById('passkeyError');

      function openPasskeyModal() {
        passkeyError.classList.add('hidden');
        passkeyModal.classList.remove('hidden');
        setTimeout(() => passkeyInput.focus(), 50);
      }

      document.getElementById('adminGearBtn').addEventListener('click', async () => {
        const ok = await checkAdminSession();
        if (ok) {
          setView('admin');
        } else {
          openPasskeyModal();
        }
      });

      document.getElementById('closePasskeyModal').addEventListener('click', () => {
        passkeyModal.classList.add('hidden');
      });

      document.getElementById('passkeyForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        passkeyError.classList.add('hidden');
        const trimmedPasskey = passkeyInput.value.trim();
        if (!trimmedPasskey) {
          passkeyError.textContent = 'Please enter the admin passkey.';
          passkeyError.classList.remove('hidden');
          return;
        }
        try {
          const res = await fetch('/api/admin/login', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ passkey: trimmedPasskey, passcode: trimmedPasskey })
          });
          const ct = res.headers.get('content-type') || '';
          if (!ct.includes('application/json')) {
            passkeyError.textContent = 'Passkey verification API (/api/admin/login) is unavailable.';
            passkeyError.classList.remove('hidden');
            return;
          }
          const data = await res.json().catch(() => ({}));
          if (res.ok && data.authenticated) {
            if (data.token) {
              state.adminToken = data.token;
              sessionStorage.setItem('deezraa_admin_token', data.token);
            }
            state.adminAuthenticated = true;
            passkeyInput.value = '';
            passkeyError.classList.add('hidden');
            passkeyModal.classList.add('hidden');
            setView('admin');
          } else if (res.status === 401) {
            passkeyError.textContent = data.error || 'Invalid admin passkey.';
            passkeyError.classList.remove('hidden');
          } else {
            passkeyError.textContent = data.error || 'Unable to verify admin passkey.';
            passkeyError.classList.remove('hidden');
          }
        } catch {
          passkeyError.textContent = 'Backend server (/api/admin/login) is required to verify the passkey.';
          passkeyError.classList.remove('hidden');
        }
      });

      // Admin Pack Modal
      const packModal = document.getElementById('adminPackModal');
      const packFeedback = document.getElementById('packModalFeedback');
      const thumbFileInput = document.getElementById('packThumbFile');

      function openPackEditor(pack) {
        packFeedback.className = 'hidden';
        const catSel = document.getElementById('packCategoryField');
        catSel.innerHTML = state.categories.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
        document.getElementById('packModalTitle').textContent = pack ? 'Edit Scene Pack' : 'Add Scene Pack';
        document.getElementById('packIdField').value = pack ? pack.id : '';
        document.getElementById('packTitleField').value = pack ? pack.title : '';
        document.getElementById('packSourceField').value = pack ? pack.sourceTitle : '';
        catSel.value = pack ? pack.categoryId : (state.categories[0]?.id || '');
        document.getElementById('packResField').value = pack ? pack.resolution : '4K UHD';
        document.getElementById('packClipsField').value = pack ? pack.clipCount : 120;
        document.getElementById('packThumbUrl').value = pack ? pack.thumbnailUrl : '';
        document.getElementById('packDescField').value = pack ? pack.description : '';
        document.getElementById('packSuitsField').checked = pack ? Boolean(pack.isSuitsCollection) : true;
        document.getElementById('packFeaturedField').checked = pack ? Boolean(pack.featured) : false;
        packModal.classList.remove('hidden');
      }

      document.getElementById('closePackModal').addEventListener('click', () => packModal.classList.add('hidden'));
      document.getElementById('cancelPackBtn').addEventListener('click', () => packModal.classList.add('hidden'));

      thumbFileInput.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            const res = await fetch('/api/admin/upload', {
              method: 'POST',
              credentials: 'include',
              headers: adminHeaders({ 'Content-Type': 'application/json' }),
              body: JSON.stringify({ filename: file.name, dataUrl: String(reader.result) })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.url) {
              packFeedback.textContent = data.error || 'Thumbnail upload failed.';
              packFeedback.className = 'alert-error';
            } else {
              document.getElementById('packThumbUrl').value = data.url;
              packFeedback.textContent = 'Thumbnail uploaded.';
              packFeedback.className = 'alert-ok';
            }
          } catch {
            packFeedback.textContent = 'Upload failed. Ensure backend server is running.';
            packFeedback.className = 'alert-error';
          }
        };
        reader.readAsDataURL(file);
      });

      document.getElementById('packEditorForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('packIdField').value;
        const payload = {
          title: document.getElementById('packTitleField').value.trim(),
          sourceTitle: document.getElementById('packSourceField').value.trim(),
          categoryId: document.getElementById('packCategoryField').value,
          resolution: document.getElementById('packResField').value,
          clipCount: Number(document.getElementById('packClipsField').value) || 60,
          thumbnailUrl: document.getElementById('packThumbUrl').value.trim(),
          description: document.getElementById('packDescField').value.trim(),
          isSuitsCollection: document.getElementById('packSuitsField').checked,
          featured: document.getElementById('packFeaturedField').checked
        };
        try {
          const res = await fetch(id ? '/api/admin/packs/' + encodeURIComponent(id) : '/api/admin/packs', {
            method: id ? 'PUT' : 'POST',
            credentials: 'include',
            headers: adminHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify(payload)
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            packFeedback.textContent = data.error || 'Failed to save scene pack.';
            packFeedback.className = 'alert-error';
            return;
          }
          packModal.classList.add('hidden');
          state.statusNotice = id ? 'Scene pack updated.' : 'Scene pack saved.';
          await loadCatalog();
        } catch {
          packFeedback.textContent = 'Network error saving scene pack.';
          packFeedback.className = 'alert-error';
        }
      });

      render();
      loadCatalog();
    })();
  </script>
</body>
</html>
